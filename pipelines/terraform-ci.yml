name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "Azure login (OIDC) + Terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: ps 
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          # 1. GLOBAL PURGE: Recursively find and delete ALL .terraform folders 
          # This is the only way to guarantee the "reinitialization required" error is cleared
          Write-Host "==> Force purging all local Terraform caches to reset backend"
          Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter ".terraform" -Recurse | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path "$(Build.SourcesDirectory)" -Filter "terraform.tfstate*" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          # 2. PATH SANITIZATION: Ensure Windows backslashes for all file operations
          $workDir = "$(Build.SourcesDirectory)/$(TF_ROOT)".Replace("/", "\")
          $planPath = "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan".Replace("/", "\")
          
          Write-Host "==> Working Directory: $workDir"
          Write-Host "==> Target Plan Path: $planPath"

          # 3. EXECUTION: Use Push-Location to ensure shell focus is correct on Windows
          Push-Location $workDir
          try {
              Write-Host "==> Terraform fmt check"
              terraform fmt -check -recursive

              Write-Host "==> Terraform init"
              terraform init -reconfigure `
                -backend-config="resource_group_name=$env:TF_STATE_RG" `
                -backend-config="storage_account_name=$env:TF_STATE_STORAGE" `
                -backend-config="container_name=tfstate" `
                -backend-config="key=terraform.tfstate"

              Write-Host "==> Terraform validate"
              terraform validate

              Write-Host "==> Terraform plan"
              terraform plan -out="$planPath" -input=false

              if (!(Test-Path "$planPath")) {
                  throw "Terraform plan file was not created at $planPath"
              }

              Write-Host "==> Generating Text Plan"
              terraform show -no-color "$planPath" | Out-File -FilePath "$planPath.txt" -Encoding utf8
          }
          finally {
              Pop-Location
          }

    # ---------------------------
    # Publish plan artifacts
    # ---------------------------
    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text