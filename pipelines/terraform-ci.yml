# pipelines/terraform-ci.yml
name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"   # pin if you prefer stability; change as needed

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    # ---------------------------
    # Checkov (IaC Scan)
    # ---------------------------
    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"

          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"

          # Scan only Terraform folder (no redundancy with app pipeline)
          checkov -d "$(TF_ROOT)" --quiet

    # ---------------------------
    # Terraform init/validate/plan (OIDC)
    # ---------------------------
    - task: AzureCLI@2
      displayName: "Azure login (OIDC) + Terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = "Stop"

          echo "==> Terraform fmt check"
          terraform -chdir="$(TF_ROOT)" fmt -check -recursive

          echo "==> Terraform init (backend.hcl)"
          terraform -chdir="$(TF_ROOT)" init -reconfigure -backend-config=backend.hcl

          echo "==> Terraform validate"
          terraform -chdir="$(TF_ROOT)" validate

          echo "==> Terraform plan"
          terraform -chdir="$(TF_ROOT)" plan -out=tfplan -input=false

          echo "==> Show plan"
          terraform -chdir="$(TF_ROOT)" show -no-color tfplan | Out-File -FilePath "$(TF_ROOT)/tfplan.txt" -Encoding utf8

    # ---------------------------
    # Publish plan artifacts (MAIN only)
    # ---------------------------
    - publish: "$(TF_ROOT)/tfplan"
      displayName: "Publish tfplan artifact (main only)"
      artifact: tfplan
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

    - publish: "$(TF_ROOT)/tfplan.txt"
      displayName: "Publish tfplan text artifact (main only)"
      artifact: tfplan-text
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))