name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self
      clean: true

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "OIDC Login + terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: "pscore"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Write-Host "==> Cleaning stale local Terraform artifacts"
          if (Test-Path "$(TF_ROOT)/.terraform") { Remove-Item -Path "$(TF_ROOT)/.terraform" -Recurse -Force }
          if (Test-Path "$(TF_ROOT)/.terraform.lock.hcl") { Remove-Item -Path "$(TF_ROOT)/.terraform.lock.hcl" -Force }

          Write-Host "==> Terraform fmt check"
          terraform -chdir="$(TF_ROOT)" fmt -check -recursive

          # --- OIDC -> Terraform AzureRM auth ---
          $env:ARM_CLIENT_ID       = $env:servicePrincipalId
          $env:ARM_TENANT_ID       = $env:tenantId
          $env:ARM_OIDC_TOKEN      = $env:idToken
          $env:ARM_SUBSCRIPTION_ID = $env:TF_SUBSCRIPTION_ID
          $env:ARM_USE_OIDC        = "true"

          # --- Backend values from Variable Group via env ---
          $env:TF_STATE_RG      = $env:TFSTATE_RG
          $env:TF_STATE_STORAGE = $env:TFSTATE_STORAGE
          $env:TF_STATE_CONT    = $env:TFSTATE_CONTAINER
          $env:TF_STATE_KEY     = $env:TFSTATE_KEY

          Write-Host "==> Terraform init (remote backend, OIDC)"
          terraform -chdir="$(TF_ROOT)" init -reconfigure `
            -backend-config="resource_group_name=$env:TF_STATE_RG" `
            -backend-config="storage_account_name=$env:TF_STATE_STORAGE" `
            -backend-config="container_name=$env:TF_STATE_CONT" `
            -backend-config="key=$env:TF_STATE_KEY" `
            -backend-config="use_oidc=true" `
            -backend-config="use_azuread_auth=true"

          Write-Host "==> Terraform validate"
          terraform -chdir="$(TF_ROOT)" validate

          Write-Host "==> Terraform plan"
          $planPath = "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
          terraform -chdir="$(TF_ROOT)" plan -out="$planPath" -input=false

          Write-Host "==> Terraform show"
          terraform -chdir="$(TF_ROOT)" show -no-color "$planPath" | Out-File -FilePath "$planPath.txt" -Encoding utf8
      env:
        # from your variable group (rg-tfstate-devopspy-dev)
        TF_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        TFSTATE_RG: $(TFSTATE_RG)
        TFSTATE_STORAGE: $(TFSTATE_STORAGE)
        TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
        TFSTATE_KEY: $(TFSTATE_KEY)

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text