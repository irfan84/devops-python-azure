# pipelines/terraform-ci.yml
name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev # Ensure this group has TF_STATE_RG and TF_STATE_STORAGE
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    # ---------------------------
    # Checkov (IaC Scan)
    # ---------------------------
    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    # ---------------------------
    # Terraform init/validate/plan (OIDC)
    # ---------------------------
    - task: AzureCLI@2
      displayName: "Azure login (OIDC) + Terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: ps
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          Write-Host "==> Terraform fmt check"
          terraform -chdir="$(TF_ROOT)" fmt -check -recursive

          # FIX 1: Dynamic Init. This removes the need for a backend.hcl file in GitHub.
          # Make sure these variable names match your ADO Variable Group.
          Write-Host "==> Terraform init (Dynamic Config)"
          terraform -chdir="$(TF_ROOT)" init -reconfigure `
            -backend-config="resource_group_name=$(TF_STATE_RG)" `
            -backend-config="storage_account_name=$(TF_STATE_STORAGE)" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=terraform.tfstate"

          Write-Host "==> Terraform validate"
          terraform -chdir="$(TF_ROOT)" validate

          Write-Host "==> Terraform plan"
          terraform -chdir="$(TF_ROOT)" plan -out=tfplan -input=false

          # FIX 2: Ensure the text plan is saved explicitly within TF_ROOT for the publish step
          Write-Host "==> Show plan"
          terraform -chdir="$(TF_ROOT)" show -no-color tfplan | Out-File -FilePath "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt" -Encoding utf8

    # ---------------------------
    # Publish plan artifacts (Required for CD)
    # ---------------------------
    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan
      # Removed 'main only' condition because you need to see the plan in PRs to verify!

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text