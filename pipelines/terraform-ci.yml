name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include: [ main ]
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include: [ main ]
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  # ✅ Use YOUR real Variable Group name (from your screenshot)
  - group: rg-tfstate-devopspy-dev

  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "OIDC Login + terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: "pscore"
        scriptLocation: "inlineScript"
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          # ---- OIDC -> Terraform AzureRM auth (THIS FIXES your screenshot error) ----
          $env:ARM_CLIENT_ID       = $env:servicePrincipalId
          $env:ARM_TENANT_ID       = $env:tenantId
          $env:ARM_OIDC_TOKEN      = $env:idToken
          $env:ARM_SUBSCRIPTION_ID = "$(ARM_SUBSCRIPTION_ID)"
          $env:ARM_USE_OIDC        = "true"

          # Clean stale local TF artifacts on self-hosted agents
          if (Test-Path "$(TF_ROOT)\.terraform") { Remove-Item "$(TF_ROOT)\.terraform" -Recurse -Force }
          if (Test-Path "$(TF_ROOT)\.terraform.lock.hcl") { Remove-Item "$(TF_ROOT)\.terraform.lock.hcl" -Force }

          terraform -chdir="$(TF_ROOT)" fmt -check -recursive

          # Backend config injected from variable group (no hardcoding in repo)
          terraform -chdir="$(TF_ROOT)" init -reconfigure `
            -backend-config="resource_group_name=$(TFSTATE_RG)" `
            -backend-config="storage_account_name=$(TFSTATE_STORAGE)" `
            -backend-config="container_name=$(TFSTATE_CONTAINER)" `
            -backend-config="key=$(TFSTATE_KEY)" `
            -backend-config="use_oidc=true" `
            -backend-config="use_azuread_auth=true"

          terraform -chdir="$(TF_ROOT)" validate

          # Plan file path MUST be explicit + consistent
          $planPath = Join-Path $env:BUILD_SOURCESDIRECTORY "$(TF_ROOT)\tfplan"
          terraform -chdir="$(TF_ROOT)" plan -out="$planPath" -input=false

          terraform -chdir="$(TF_ROOT)" show -no-color "$planPath" | Out-File -FilePath "$planPath.txt" -Encoding utf8

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish tfplan.txt"
      artifact: tfplan-text