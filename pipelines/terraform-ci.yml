name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "Azure login (OIDC) + Terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: ps 
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          # 1. FORCE CLEANUP: Purge local cache to fix "Reinitialization required" errors
          Write-Host "==> Cleaning stale local Terraform artifacts"
          $dotTerraform = Join-Path "$(Build.SourcesDirectory)" "$(TF_ROOT)/.terraform"
          if (Test-Path $dotTerraform) { Remove-Item -Path $dotTerraform -Recurse -Force }

          # 2. PATH FIX: Sanitize paths for Windows self-hosted agents
          $planPathRaw = "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
          $planPath = $planPathRaw.Replace("/", "\")
          Write-Host "==> Target Plan Path: $planPath"

          Write-Host "==> Terraform fmt check"
          terraform -chdir="$(TF_ROOT)" fmt -check -recursive

          # 3. INIT: Reconfigure without migrate-state (avoiding interactive prompts)
          Write-Host "==> Terraform init"
          terraform -chdir="$(TF_ROOT)" init -reconfigure `
            -backend-config="resource_group_name=$env:TF_STATE_RG" `
            -backend-config="storage_account_name=$env:TF_STATE_STORAGE" `
            -backend-config="container_name=tfstate" `
            -backend-config="key=terraform.tfstate"

          Write-Host "==> Terraform validate"
          terraform -chdir="$(TF_ROOT)" validate

          # 4. PLAN: Execute and verify file creation
          Write-Host "==> Terraform plan"
          terraform -chdir="$(TF_ROOT)" plan -out="$planPath" -input=false

          if (!(Test-Path "$planPath")) {
              Write-Error "Terraform plan file was not created. Check logs above for failures."
              exit 1
          }

          # 5. SHOW: Generate text plan for UI review
          Write-Host "==> Show plan"
          terraform -chdir="$(TF_ROOT)" show -no-color "$planPath" | Out-File -FilePath "$planPath.txt" -Encoding utf8

    # ---------------------------
    # Publish plan artifacts
    # ---------------------------
    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text