name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self
      clean: true

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "OIDC Login + terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        scriptType: ps 
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          # 1. Normalize Paths for Windows
          $baseDir = "$(Build.SourcesDirectory)"
          $tfDir = Join-Path $baseDir "$(TF_ROOT)"
          $planPath = Join-Path $tfDir "tfplan"

          # 2. NUCLEAR CLEANUP: Rename stale folder if delete fails (common on Windows agents)
          Write-Host "==> Resetting local Terraform state"
          $dotTerraform = Join-Path $tfDir ".terraform"
          if (Test-Path $dotTerraform) { 
              $timestamp = Get-Date -Format "yyyyMMddHHmmss"
              Rename-Item -Path $dotTerraform -NewName "$($dotTerraform)_old_$timestamp" -ErrorAction SilentlyContinue
              # Try delete again now that it's moved, but don't stop if it fails
              Remove-Item -Path "$($dotTerraform)_old_$timestamp" -Recurse -Force -ErrorAction SilentlyContinue
          }
          
          # 3. Execution using Push-Location
          Push-Location $tfDir
          try {
              Write-Host "==> OIDC Authentication Setup"
              $env:ARM_CLIENT_ID       = $env:servicePrincipalId
              $env:ARM_TENANT_ID       = $env:tenantId
              $env:ARM_OIDC_TOKEN      = $env:idToken
              $env:ARM_SUBSCRIPTION_ID = $env:TF_SUBSCRIPTION_ID
              $env:ARM_USE_OIDC        = "true"

              Write-Host "==> Terraform init (remote backend, OIDC)"
              # Added -input=false and -force-copy to ensure no interactive prompts hang the agent
              terraform init -reconfigure -input=false -force-copy `
                -backend-config="resource_group_name=$env:TFSTATE_RG" `
                -backend-config="storage_account_name=$env:TFSTATE_STORAGE" `
                -backend-config="container_name=$env:TFSTATE_CONTAINER" `
                -backend-config="key=$env:TFSTATE_KEY" `
                -backend-config="use_oidc=true" `
                -backend-config="use_azuread_auth=true"

              Write-Host "==> Terraform fmt check"
              terraform fmt -check -recursive

              Write-Host "==> Terraform validate"
              terraform validate

              Write-Host "==> Terraform plan"
              terraform plan -out="$planPath" -input=false

              if (!(Test-Path "$planPath")) { throw "CRITICAL: tfplan file not found! Init likely failed silently." }

              Write-Host "==> Terraform show"
              terraform show -no-color "$planPath" | Out-File -FilePath "$planPath.txt" -Encoding utf8
          }
          finally {
              Pop-Location
          }
      env:
        TF_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
        TFSTATE_RG: $(TFSTATE_RG)
        TFSTATE_STORAGE: $(TFSTATE_STORAGE)
        TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
        TFSTATE_KEY: $(TFSTATE_KEY)

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text