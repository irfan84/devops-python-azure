name: terraform-ci-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - pipelines/terraform-ci.yml
      - pipelines/terraform-cd.yml

variables:
  # ✅ This should be your VARIABLE GROUP name (NOT a resource group name)
  # Example variable group name: vg-devopspy-terraform-dev
  - group: rg-tfstate-devopspy-dev

  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"
  - name: CHECKOV_VERSION
    value: "3.2.0"

stages:
- stage: ValidateAndPlan
  displayName: "Terraform Validate + Plan + IaC Scan"
  jobs:
  - job: Plan
    displayName: "Plan"
    pool:
      name: self-hosted-dev

    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform $(TF_VERSION)"
      inputs:
        terraformVersion: "$(TF_VERSION)"

    - task: PowerShell@2
      displayName: "IaC Security Scan (Checkov)"
      inputs:
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          pip install "checkov==$(CHECKOV_VERSION)"
          checkov -d "$(TF_ROOT)" --quiet

    - task: AzureCLI@2
      displayName: "Azure login (OIDC) + Terraform init/validate/plan"
      inputs:
        azureSubscription: "sc-devopspy-terraform-oidc"
        # ✅ Use PowerShell Core to avoid bash path issues on Windows agents
        scriptType: pscore
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          $ErrorActionPreference = "Stop"

          # 0) Sanity check expected backend vars (from Variable Group)
          if (-not $env:TFSTATE_RG) { throw "Missing env var TFSTATE_RG (set it in Variable Group)." }
          if (-not $env:TFSTATE_SA) { throw "Missing env var TFSTATE_SA (set it in Variable Group)." }
          if (-not $env:TFSTATE_CONTAINER) { throw "Missing env var TFSTATE_CONTAINER (set it in Variable Group)." }
          if (-not $env:TFSTATE_KEY) { throw "Missing env var TFSTATE_KEY (set it in Variable Group)." }

          # 1) CLEANUP: Remove stale local Terraform artifacts on self-hosted agents
          Write-Host "==> Cleaning stale local Terraform artifacts"
          $tfDir = "$(Build.SourcesDirectory)\$(TF_ROOT)"
          if (Test-Path "$tfDir\.terraform") { Remove-Item -Path "$tfDir\.terraform" -Recurse -Force }
          if (Test-Path "$tfDir\terraform.tfstate") { Remove-Item -Path "$tfDir\terraform.tfstate" -Force }
          if (Test-Path "$tfDir\tfplan") { Remove-Item -Path "$tfDir\tfplan" -Force }
          if (Test-Path "$tfDir\tfplan.txt") { Remove-Item -Path "$tfDir\tfplan.txt" -Force }

          # 2) fmt check
          Write-Host "==> Terraform fmt check"
          terraform -chdir="$tfDir" fmt -check -recursive

          # 3) init (OIDC/AAD backend + reconfigure)
          Write-Host "==> Terraform init"
          terraform -chdir="$tfDir" init -reconfigure `
            -backend-config="resource_group_name=$env:TFSTATE_RG" `
            -backend-config="storage_account_name=$env:TFSTATE_SA" `
            -backend-config="container_name=$env:TFSTATE_CONTAINER" `
            -backend-config="key=$env:TFSTATE_KEY" `
            -backend-config="use_azuread_auth=true" `
            -backend-config="use_oidc=true"

          # 4) validate
          Write-Host "==> Terraform validate"
          terraform -chdir="$tfDir" validate

          # 5) plan (write inside TF_ROOT so publish steps match)
          Write-Host "==> Terraform plan"
          $planPath = "$tfDir\tfplan"
          terraform -chdir="$tfDir" plan -out="$planPath" -input=false

          # 6) show
          Write-Host "==> Terraform show"
          terraform -chdir="$tfDir" show -no-color "$planPath" | Out-File -FilePath "$tfDir\tfplan.txt" -Encoding utf8

    # ---------------------------
    # Publish plan artifacts
    # ---------------------------
    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan"
      displayName: "Publish binary tfplan"
      artifact: tfplan

    - publish: "$(Build.SourcesDirectory)/$(TF_ROOT)/tfplan.txt"
      displayName: "Publish text tfplan"
      artifact: tfplan-text