name: terraform-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: tfci
    source: terraform-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"

stages:
- stage: Apply_Dev
  displayName: "Terraform Apply (Dev)"
  jobs:
  - deployment: Apply
    displayName: "Apply tfplan"
    pool:
      name: self-hosted-dev

    environment: devopspy-prod

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - download: tfci
            displayName: "Download artifacts"
            artifact: tfplan

          - download: tfci
            displayName: "Download lockfile"
            artifact: tf-lockfile

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: "$(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "OIDC Login + Terraform Init + Robust Apply"
            inputs:
              azureSubscription: "sc-devopspy-terraform-oidc"
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"

                # 1. OIDC Env Setup
                $env:ARM_USE_OIDC         = "true"
                $env:ARM_OIDC_TOKEN       = $env:idToken
                $env:ARM_CLIENT_ID        = "$(ARM_CLIENT_ID)"
                $env:ARM_TENANT_ID        = "$(ARM_TENANT_ID)"
                $env:ARM_SUBSCRIPTION_ID  = "$(ARM_SUBSCRIPTION_ID)"

                # 2. Resolve CI commit
                $ciCommit = $env:CI_COMMIT_ID
                if ([string]::IsNullOrWhiteSpace($ciCommit)) {
                    $runId = $env:RESOURCES_PIPELINES_TFCI_RUNID
                    $token = $env:SYSTEM_ACCESSTOKEN
                    $url = "$(System.CollectionUri)$(System.TeamProject)/_apis/pipelines/$(resources.pipelines.tfci.pipelineID)/runs/$runId?api-version=7.1-preview.1"
                    $run = Invoke-RestMethod -Uri $url -Headers @{Authorization="Bearer $token"}
                    $ciCommit = $run.resources.repositories.self.version
                }
                git fetch --all; git checkout $ciCommit

                $tfDir = Join-Path "$(Build.SourcesDirectory)" "$(TF_ROOT)"
                Push-Location $tfDir
                try {
                    if (Test-Path ".terraform") { Remove-Item -Recurse -Force ".terraform" }
                    Copy-Item "$(Pipeline.Workspace)/tfci/tf-lockfile/.terraform.lock.hcl" ".\.terraform.lock.hcl" -Force
                    Copy-Item "$(Pipeline.Workspace)/tfci/tfplan/tfplan" ".\tfplan" -Force

                    Write-Host "==> Initializing Terraform"
                    terraform init -reconfigure -input=false -lockfile=readonly `
                      -backend-config="resource_group_name=$env:TFSTATE_RG" `
                      -backend-config="storage_account_name=$env:TFSTATE_SA" `
                      -backend-config="container_name=$env:TFSTATE_CONTAINER" `
                      -backend-config="key=$env:TFSTATE_KEY" `
                      -backend-config="use_oidc=true" `
                      -backend-config="use_azuread_auth=true"

                    $currentIp = $null
                    try {
                        $currentIp = (Invoke-RestMethod -Uri "https://ifconfig.me/ip").Trim()
                        Write-Host "==> Whitelisting Agent IP: $currentIp"
                        az keyvault network-rule add --name "$env:KV_NAME" --ip-address "$currentIp"

                        # Robust Retry Logic
                        $maxRetries = 3
                        $retryCount = 0
                        $success = $false

                        while (-not $success -and $retryCount -lt $maxRetries) {
                            $retryCount++
                            # FIXED LINE BELOW: Used ${} to delimit variable from colon
                            Write-Host "==> Attempt $retryCount of ${maxRetries}: Terraform Apply"
                            
                            $waitTime = 30 + ($retryCount * 30)
                            Write-Host "Waiting $waitTime seconds for firewall propagation..."
                            Start-Sleep -Seconds $waitTime

                            & terraform apply -auto-approve -input=false -var="use_oidc=true" -compact-warnings

                            if ($LASTEXITCODE -eq 0) {
                                $success = $true
                                Write-Host "==> Success! Terraform applied."
                            } else {
                                Write-Warning "Terraform failed (Exit Code $LASTEXITCODE). Could be firewall propagation. Retrying..."
                            }
                        }

                        if (-not $success) {
                            throw "Terraform Apply failed after $maxRetries attempts."
                        }
                    }
                    finally {
                        if ($null -ne $currentIp) {
                            Write-Host "==> Cleanup: Removing Firewall Rule"
                            az keyvault network-rule remove --name "$env:KV_NAME" --ip-address "$currentIp"
                        }
                    }
                }
                finally {
                    Pop-Location
                }
            env:
              TFSTATE_RG: $(TFSTATE_RG)
              TFSTATE_SA: $(TFSTATE_SA)
              TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
              TFSTATE_KEY: $(TFSTATE_KEY)
              KV_NAME: $(KV_NAME)
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              CI_COMMIT_ID: $(resources.pipelines.tfci.sourceVersion)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)