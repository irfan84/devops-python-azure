name: terraform-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: tfci
    source: terraform-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"

stages:
- stage: Apply_Dev
  displayName: "Terraform Apply (Dev)"
  jobs:
  - deployment: Apply
    displayName: "Apply tfplan"
    pool:
      name: self-hosted-dev

    environment: devopspy-prod

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - download: tfci
            displayName: "Download tfplan artifact from CI"
            artifact: tfplan

          - download: tfci
            displayName: "Download terraform lockfile artifact"
            artifact: tf-lockfile

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: "$(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "OIDC Login + Terraform Init + Apply"
            inputs:
              azureSubscription: "sc-devopspy-terraform-oidc"
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"

                # OIDC for azurerm
                $env:ARM_USE_OIDC        = "true"
                $env:ARM_OIDC_TOKEN      = $env:idToken
                $env:ARM_CLIENT_ID       = "$(ARM_CLIENT_ID)"
                $env:ARM_TENANT_ID       = "$(ARM_TENANT_ID)"
                $env:ARM_SUBSCRIPTION_ID = "$(ARM_SUBSCRIPTION_ID)"

                Write-Host "==> Which terraform am I running?"
                terraform version

                # Prefer CI_COMMIT_ID if provided
                $ciCommit = $env:CI_COMMIT_ID

                # Fallback: resolve commit from CI pipeline run using RUNID + REST API
                if ([string]::IsNullOrWhiteSpace($ciCommit)) {
                    $runId = $env:RESOURCES_PIPELINES_TFCI_RUNID
                    if ([string]::IsNullOrWhiteSpace($runId)) {
                        throw "CI commit SHA not available. If running manually, select a terraform-ci run under 'Resources' before running CD."
                    }

                    $token = $env:SYSTEM_ACCESSTOKEN
                    if ([string]::IsNullOrWhiteSpace($token)) {
                        throw "SYSTEM_ACCESSTOKEN is empty. Enable 'Allow scripts to access the OAuth token' for this pipeline."
                    }

                    $orgUrl  = "$(System.CollectionUri)".TrimEnd('/')
                    $project = "$(System.TeamProject)"
                    $pipeId  = "$(resources.pipelines.tfci.pipelineID)"

                    $headers = @{ Authorization = "Bearer $token" }
                    $runUrl  = "$orgUrl/$project/_apis/pipelines/$pipeId/runs/$runId?api-version=7.1-preview.1"

                    Write-Host "==> Resolving CI commit from runId=$runId (pipelineId=$pipeId)"
                    $run = Invoke-RestMethod -Method Get -Uri $runUrl -Headers $headers

                    $ciCommit = $run.resources.repositories.self.version
                    if ([string]::IsNullOrWhiteSpace($ciCommit)) {
                        throw "Could not resolve CI commit SHA from pipeline run details."
                    }
                }

                Write-Host "==> Checking out CI commit: $ciCommit"
                git fetch --all --tags --prune
                git checkout $ciCommit

                $tfDir = Join-Path "$(Build.SourcesDirectory)" "$(TF_ROOT)"
                Push-Location $tfDir
                try {
                    if (Test-Path ".terraform") { Remove-Item -Recurse -Force ".terraform" }

                    Write-Host "==> Restore lockfile from artifact"
                    Copy-Item "$(Pipeline.Workspace)/tfci/tf-lockfile/.terraform.lock.hcl" ".\.terraform.lock.hcl" -Force

                    Write-Host "==> Copy plan artifact"
                    Copy-Item "$(Pipeline.Workspace)/tfci/tfplan/tfplan" ".\tfplan" -Force

                    Write-Host "==> Terraform init (lockfile readonly, no upgrades)"
                    terraform init -reconfigure -input=false -lockfile=readonly `
                      -backend-config="resource_group_name=$env:TFSTATE_RG" `
                      -backend-config="storage_account_name=$env:TFSTATE_SA" `
                      -backend-config="container_name=$env:TFSTATE_CONTAINER" `
                      -backend-config="key=$env:TFSTATE_KEY" `
                      -backend-config="use_oidc=true" `
                      -backend-config="use_azuread_auth=true"

                   # --- MODIFIED SECTION START ---
                    try {
                        Write-Host "==> STEP 1: Punching Firewall Hole"
                        $currentIp = (Invoke-RestMethod -Uri "https://ifconfig.me/ip").Trim()
                        Write-Host "Current Agent IP detected: $currentIp"

                        # Immediate bypass via CLI
                        az keyvault network-rule add --name "$env:KV_NAME" --ip-address "$currentIp"

                        Write-Host "==> Waiting 60s for New Zealand North propagation..."
                        Start-Sleep -Seconds 60

                        Write-Host "==> STEP 2: Fresh Terraform Apply"
                        # Note: Use fresh apply to ensure new network context is picked up
                        & terraform apply -auto-approve -input=false -backend-config="resource_group_name=$env:TFSTATE_RG" -backend-config="storage_account_name=$env:TFSTATE_SA" -backend-config="container_name=$env:TFSTATE_CONTAINER" -backend-config="key=$env:TFSTATE_KEY"
                    }
                    finally {
                        Write-Host "==> STEP 3: Enterprise Cleanup - Closing Firewall Hole"
                        if ($currentIp) {
                            az keyvault network-rule remove --name "$env:KV_NAME" --ip-address "$currentIp"
                        }
                    }
                    # --- MODIFIED SECTION END ---
                }
                finally {
                    Pop-Location
                }
            env:
              TFSTATE_RG: $(TFSTATE_RG)
              TFSTATE_SA: $(TFSTATE_SA)
              TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
              TFSTATE_KEY: $(TFSTATE_KEY)
              KV_NAME: $(KV_NAME)
              CI_COMMIT_ID: $(resources.pipelines.tfci.sourceVersion)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)