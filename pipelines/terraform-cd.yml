name: terraform-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: tfci
    source: terraform-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"

stages:
- stage: Apply_Dev
  displayName: "Terraform Apply (Dev)"
  jobs:
  - deployment: Apply
    displayName: "Apply tfplan"
    pool:
      name: self-hosted-dev
    environment: devopspy-prod 
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - download: tfci
            displayName: "Download artifacts"
            artifact: tfplan

          - download: tfci
            displayName: "Download lockfile"
            artifact: tf-lockfile

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: "$(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "Enterprise Deployment: Live Bridge + Apply"
            inputs:
              azureSubscription: "sc-devopspy-terraform-oidc"
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"

                # 1. Smart Bridge: Detect Key Vault and Runner IP
                $currentRunnerIp = $null
                $kvExists = az keyvault show --name "$env:KV_NAME" --resource-group "$env:TFSTATE_RG" --query "id" -o tsv 2>$null

                if ($null -ne $kvExists) {
                    $currentRunnerIp = (Invoke-RestMethod -Uri "https://ifconfig.me/ip").Trim()
                    Write-Host "==> Key Vault Detected. Bridging Live Runner IP: $currentRunnerIp"
                    az keyvault network-rule add --name "$env:KV_NAME" --ip-address "$currentRunnerIp"
                } else {
                    Write-Host "==> Key Vault '$env:KV_NAME' not found. Skipping bridge (Initial Setup)."
                }

                # 2. OIDC Env Setup
                $env:ARM_USE_OIDC         = "true"
                $env:ARM_OIDC_TOKEN       = $env:idToken
                $env:ARM_CLIENT_ID        = "$(ARM_CLIENT_ID)"
                $env:ARM_TENANT_ID        = "$(ARM_TENANT_ID)"
                $env:ARM_SUBSCRIPTION_ID  = "$(ARM_SUBSCRIPTION_ID)"

                $tfDir = Join-Path "$(Build.SourcesDirectory)" "$(TF_ROOT)"
                Push-Location $tfDir
                
                try {
                    # Environment Prep
                    if (Test-Path ".terraform") { Remove-Item -Recurse -Force ".terraform" }
                    Copy-Item "$(Pipeline.Workspace)/tfci/tf-lockfile/.terraform.lock.hcl" ".\.terraform.lock.hcl" -Force
                    
                    $planPath = "$(Pipeline.Workspace)/tfci/tfplan/tfplan"
                    if (-not (Test-Path $planPath)) { throw "Critical Error: tfplan not found" }

                    Write-Host "==> Initializing Terraform"
                    terraform init -reconfigure -input=false -lockfile=readonly `
                      -backend-config="resource_group_name=$env:TFSTATE_RG" `
                      -backend-config="storage_account_name=$env:TFSTATE_SA" `
                      -backend-config="container_name=$env:TFSTATE_CONTAINER" `
                      -backend-config="key=$env:TFSTATE_KEY" `
                      -backend-config="use_oidc=true" `
                      -backend-config="use_azuread_auth=true"

                    # 3. Apply Loop
                    $success = $false
                    $attempt = 1
                    while (-not $success -and $attempt -le 2) {
                        Write-Host "==> Apply Attempt ${attempt}: Waiting 45s for Propagation..."
                        Start-Sleep -Seconds 45
                        
                        terraform apply -input=false -compact-warnings -auto-approve $planPath
                        
                        if ($LASTEXITCODE -eq 0) {
                            $success = $true
                            Write-Host "Successfully applied."
                        } else {
                            if ($attempt -eq 1) {
                                Write-Warning "Attempt 1 failed. Retrying..."
                                $attempt++
                            } else {
                                throw "Terraform Apply failed."
                            }
                        }
                    }
                }
                finally {
                    # 4. Mandatory Cleanup (Only if bridge was added)
                    if ($null -ne $currentRunnerIp) {
                        Write-Host "==> Cleanup: Removing runner rule: $currentRunnerIp"
                        az keyvault network-rule remove --name "$env:KV_NAME" --ip-address "$currentRunnerIp"
                    }
                    Pop-Location
                }
            env:
              TFSTATE_RG: $(TFSTATE_RG)
              TFSTATE_SA: $(TFSTATE_SA)
              TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
              TFSTATE_KEY: $(TFSTATE_KEY)
              KV_NAME: $(KV_NAME)
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              CI_COMMIT_ID: $(resources.pipelines.tfci.sourceVersion)