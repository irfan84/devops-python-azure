name: terraform-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: tfci
    source: terraform-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"

stages:
- stage: Apply_Dev
  displayName: "Terraform Apply (Dev)"
  jobs:
  - deployment: Apply
    displayName: "Apply tfplan"
    pool:
      name: self-hosted-dev
    environment: devopspy-prod # Triggers manual approval if configured in ADO
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0

          - download: tfci
            displayName: "Download artifacts"
            artifact: tfplan

          - download: tfci
            displayName: "Download lockfile"
            artifact: tf-lockfile

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: "$(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "Enterprise Deployment: Init + Plan-Based Apply"
            inputs:
              azureSubscription: "sc-devopspy-terraform-oidc"
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"

                # 1. OIDC Env Setup
                $env:ARM_USE_OIDC         = "true"
                $env:ARM_OIDC_TOKEN       = $env:idToken
                $env:ARM_CLIENT_ID        = "$(ARM_CLIENT_ID)"
                $env:ARM_TENANT_ID        = "$(ARM_TENANT_ID)"
                $env:ARM_SUBSCRIPTION_ID  = "$(ARM_SUBSCRIPTION_ID)"

                # 2. Sync to CI Commit
                $ciCommit = $env:CI_COMMIT_ID
                git fetch --all; git checkout $ciCommit

                $tfDir = Join-Path "$(Build.SourcesDirectory)" "$(TF_ROOT)"
                Push-Location $tfDir
                
                try {
                    # Cleanup and prep lockfile
                    if (Test-Path ".terraform") { Remove-Item -Recurse -Force ".terraform" }
                    Copy-Item "$(Pipeline.Workspace)/tfci/tf-lockfile/.terraform.lock.hcl" ".\.terraform.lock.hcl" -Force
                    
                    # IMPORTANT: Use the plan from CI
                    $planPath = "$(Pipeline.Workspace)/tfci/tfplan/tfplan"
                    if (-not (Test-Path $planPath)) { throw "Critical Error: tfplan not found at $planPath" }

                    Write-Host "==> Initializing Terraform"
                    terraform init -reconfigure -input=false -lockfile=readonly `
                      -backend-config="resource_group_name=$env:TFSTATE_RG" `
                      -backend-config="storage_account_name=$env:TFSTATE_SA" `
                      -backend-config="container_name=$env:TFSTATE_CONTAINER" `
                      -backend-config="key=$env:TFSTATE_KEY" `
                      -backend-config="use_oidc=true" `
                      -backend-config="use_azuread_auth=true"

                    # 3. Network Rule Injection
                    # Since you added the IP to TF_VAR_office_ip, this az cli step is 
                    # a safety 'bridge' to ensure the agent has instant access.
                    $currentIp = (Invoke-RestMethod -Uri "https://ifconfig.me/ip").Trim()
                    Write-Host "==> Bridging Agent IP: $currentIp"
                    az keyvault network-rule add --name "$env:KV_NAME" --ip-address "$currentIp"

                    # 4. Enterprise Apply (Deterministic)
                    # We only allow 1 retry specifically for firewall propagation.
                    $success = $false
                    $attempt = 1
                    
                    while (-not $success -and $attempt -le 2) {
                        Write-Host "==> Apply Attempt $attempt: Waiting 45s for Azure Network Propagation..."
                        Start-Sleep -Seconds 45
                        
                        # We apply the PLAN FILE, not the directory. This is standard for Enterprise.
                        terraform apply -input=false -compact-warnings -auto-approve $planPath
                        
                        if ($LASTEXITCODE -eq 0) {
                            $success = $true
                            Write-Host "Successfully applied CI plan."
                        } else {
                            if ($attempt -eq 1) {
                                Write-Warning "First attempt failed (likely 403 propagation). Retrying once..."
                                $attempt++
                            } else {
                                throw "Terraform Apply failed after propagation retry. Check Key Vault ACLs."
                            }
                        }
                    }
                }
                finally {
                    # Always cleanup the bridge rule
                    if ($null -ne $currentIp) {
                        Write-Host "==> Cleanup: Removing temporary firewall rule"
                        az keyvault network-rule remove --name "$env:KV_NAME" --ip-address "$currentIp"
                    }
                    Pop-Location
                }
            env:
              TFSTATE_RG: $(TFSTATE_RG)
              TFSTATE_SA: $(TFSTATE_SA)
              TFSTATE_CONTAINER: $(TFSTATE_CONTAINER)
              TFSTATE_KEY: $(TFSTATE_KEY)
              KV_NAME: $(KV_NAME)
              ARM_CLIENT_ID: $(ARM_CLIENT_ID)
              ARM_TENANT_ID: $(ARM_TENANT_ID)
              ARM_SUBSCRIPTION_ID: $(ARM_SUBSCRIPTION_ID)
              CI_COMMIT_ID: $(resources.pipelines.tfci.sourceVersion)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)