name: terraform-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: tfci
    source: terraform-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: TF_ROOT
    value: terraform/main
  - name: TF_VERSION
    value: "1.6.6"

stages:
- stage: Apply_Prod
  displayName: "Terraform Apply (Prod)"
  jobs:
  - deployment: ApplyProd
    displayName: "Apply tfplan (Prod)"
    pool:
      name: self-hosted-dev

    # Use ONLY prod environment (put approvals/checks here)
    environment: devopspy-prod

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: tfci
            displayName: "Download tfplan artifacts from CI"
            artifact: tfplan

          - task: TerraformInstaller@1
            displayName: "Install Terraform $(TF_VERSION)"
            inputs:
              terraformVersion: "$(TF_VERSION)"

          - task: AzureCLI@2
            displayName: "Azure login (OIDC) + Terraform init/apply"
            inputs:
              azureSubscription: "sc-devopspy-terraform-oidc"
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = "Stop"
                Set-StrictMode -Version Latest

                echo "==> Terraform init (backend.hcl)"
                terraform -chdir="$(TF_ROOT)" init -reconfigure -backend-config=backend.hcl

                echo "==> Copy downloaded plan into TF folder"
                Get-ChildItem -Recurse "$(Pipeline.Workspace)/tfci/tfplan" | Format-List

                Copy-Item "$(Pipeline.Workspace)/tfci/tfplan/tfplan" "$(TF_ROOT)/tfplan" -Force

                echo "==> Apply downloaded plan"
                terraform -chdir="$(TF_ROOT)" apply -input=false -auto-approve "$(TF_ROOT)/tfplan"