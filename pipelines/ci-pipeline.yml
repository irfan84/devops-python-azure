trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - tests/**
      - pipelines/ci-pipeline.yml
      - pipelines/cd-pipeline.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - tests/**
      - pipelines/ci-pipeline.yml
      - pipelines/cd-pipeline.yml

pool:
  name: self-hosted-dev

variables:
  pythonVersion: '3.10'

steps:
- checkout: self

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
  displayName: "Use Python $(pythonVersion)"

# ---------------------------
# Install + Test (Standardized to PowerShell)
# ---------------------------
- task: PowerShell@2
  displayName: "Install dependencies and run unit tests"
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
      python -m pip install --upgrade pip
      pip install -r app/requirements.txt pytest
      pytest -q

# ---------------------------
# Security Scan (SAST)
# ---------------------------
- task: PowerShell@2
  displayName: "Security Scan (Bandit)"
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
      python -m pip install bandit
      
      Write-Host "==> Running Security Scan"
      bandit -r ./app -v -f screen

# ---------------------------
# Package + Publish Artifact (ONLY main)
# ---------------------------
- task: ArchiveFiles@2
  displayName: "Package app artifact (main only)"
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    rootFolderOrFile: 'app'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true

- publish: '$(Build.ArtifactStagingDirectory)/app.zip'
  displayName: "Publish artifact (main only)"
  artifact: drop
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))