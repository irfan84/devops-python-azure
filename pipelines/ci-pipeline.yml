trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - tests/**
      - pipelines/ci-pipeline.yml
      - pipelines/cd-pipeline.yml

pr:
  branches:
    include:
      - main
  paths:
    include:
      - app/**
      - tests/**
      - pipelines/ci-pipeline.yml
      - pipelines/cd-pipeline.yml

pool:
  name: self-hosted-dev

variables:
  pythonVersion: '3.10'

steps:
- checkout: self

# ---------------------------
# Use Python
# ---------------------------
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
  displayName: "Use Python $(pythonVersion)"

# ---------------------------
# Install + Test
# ---------------------------
- script: |
    python -m pip install --upgrade pip
    pip install -r app/requirements.txt
    pytest -q
  displayName: "Install dependencies and run unit tests"

# ---------------------------
# Security Scan (SAST only for app)
# ---------------------------
- script: |
    # -v for verbose, -f screen to ensure it prints to logs
    bandit -r ./app -v -f screen
  displayName: "Security Scan (Bandit)"

# ---------------------------
# Package + Publish Artifact (ONLY main)
# ---------------------------
- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: 'app'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
    replaceExistingArchive: true
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: "Package app artifact (main only)"

- publish: '$(Build.ArtifactStagingDirectory)/app.zip'
  artifact: drop
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  displayName: "Publish artifact (main only)"