name: app-cd-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

resources:
  pipelines:
  - pipeline: ci
    source: devopspy-ci
    trigger:
      branches:
        include:
          - main

variables:
  - group: rg-tfstate-devopspy-dev
  - name: RESOURCE_GROUP 
    value: rg-devopspy-dev

stages:
- stage: Deploy_Staging
  displayName: "Deploy to Staging Slot"
  jobs:
  - deployment: DeployStaging
    displayName: "Deploy app.zip to staging"
    pool:
      name: self-hosted-dev
    environment: devopspy-staging
    strategy:
      runOnce:
        deploy:
          steps:
          - download: ci
            artifact: drop

          - task: AzureWebApp@1
            displayName: "Deploy to App Service (staging slot)"
            inputs:
              azureSubscription: "sc-devopspy-app-oidc"
              appType: "webAppLinux"
              appName: "$(WEB_APP_NAME)"
              resourceGroupName: "$(RESOURCE_GROUP)"
              slotName: "staging"
              package: "$(Pipeline.Workspace)/ci/drop/app.zip"

          # Optional: smoke test before swap (recommended)
          - task: PowerShell@2
            displayName: "Smoke test staging /health"
            inputs:
              targetType: inline
              script: |
                $ErrorActionPreference = "Stop"
                $url = "https://$(WEB_APP_NAME)-staging.azurewebsites.net/health"
                Write-Host "Checking $url"
                $resp = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 30
                if ($resp.StatusCode -ne 200) { throw "Health check failed: $($resp.StatusCode)" }
                Write-Host "Staging health check OK"

- stage: Swap_To_Prod
  displayName: "Swap Staging to Production"
  dependsOn: Deploy_Staging
  condition: succeeded()
  jobs:
  - deployment: SwapSlots
    displayName: "Swap staging -> production"
    pool:
      name: self-hosted-dev
    environment: devopspy-prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureAppServiceManage@0
            displayName: "Swap slots"
            inputs:
              azureSubscription: "sc-devopspy-app-oidc"
              WebAppName: "$(WEB_APP_NAME)"
              ResourceGroupName: "$(RESOURCE_GROUP)"
              SourceSlot: "staging"
              Action: "Swap Slots"