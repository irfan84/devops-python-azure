<svg width="900" height="693" viewBox="0 0 900 693" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <rect x="0" y="0" width="900" height="693" fill="#ffffff"/>

  <!-- Outer container -->
  <rect x="30" y="30" width="840" height="640" rx="16" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>

  <!-- Title bar -->
  <rect x="30" y="30" width="840" height="40" rx="16" fill="#534AB7"/>
  <rect x="30" y="54" width="840" height="16" fill="#534AB7"/>
  <text x="450" y="56" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#CECBF6">Enterprise Azure DevOps Automation Platform</text>
  <text x="450" y="82" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Secretless · Zero-downtime · NZ Privacy Act compliant</text>

  <!-- TRIGGER ROW -->
  <rect x="50" y="100" width="800" height="90" rx="10" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="0.6"/>
  <text x="450" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441">Developer trigger</text>

  <!-- Feature branch -->
  <rect x="80" y="132" width="190" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="175" y="151" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Feature branch push</text>
  <text x="175" y="167" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">triggers App + Infra CI</text>

  <!-- PR -->
  <rect x="355" y="132" width="190" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="450" y="151" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Pull request to main</text>
  <text x="450" y="167" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">requires CI pass + peer review</text>

  <!-- Merge -->
  <rect x="630" y="132" width="190" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="725" y="151" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#3C3489">Merge to main</text>
  <text x="725" y="167" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#534AB7">triggers CD pipeline</text>

  <!-- trigger arrows -->
  <line x1="270" y1="154" x2="353" y2="154" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="154" x2="628" y2="154" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- down arrows to CI -->
  <line x1="175" y1="176" x2="175" y2="222" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="450" y1="176" x2="450" y2="222" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- down arrow from merge to CD (green) -->
  <line x1="725" y1="176" x2="725" y2="400" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CI SECTION -->
  <rect x="50" y="222" width="560" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="330" y="244" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">CI — Continuous Integration</text>

  <!-- App CI box -->
  <rect x="75" y="258" width="220" height="88" rx="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="185" y="281" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53">App CI</text>
  <text x="185" y="299" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">Pytest — unit tests</text>
  <text x="185" y="315" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">Bandit — Python SAST scan</text>
  <text x="185" y="331" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">Must pass before merge</text>

  <!-- Infra CI box -->
  <rect x="315" y="258" width="270" height="88" rx="7" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.8"/>
  <text x="450" y="281" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#042C53">Infra CI</text>
  <text x="450" y="299" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">terraform validate + plan</text>
  <text x="450" y="315" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">Checkov — IaC security scan</text>
  <text x="450" y="331" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0C447C">Must pass before merge</text>

  <!-- OIDC box -->
  <rect x="630" y="222" width="220" height="140" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="740" y="248" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">OIDC Auth</text>
  <text x="740" y="268" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Workload Identity</text>
  <text x="740" y="284" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Federation</text>
  <text x="740" y="304" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">No secrets stored</text>
  <text x="740" y="320" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">anywhere in pipeline</text>
  <text x="740" y="340" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">JWT token exchange</text>

  <!-- CI to OIDC dashed arrow -->
  <line x1="610" y1="292" x2="628" y2="292" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="619" y="283" text-anchor="middle" font-size="10" fill="#0F6E56">authenticates</text>

  <!-- down arrow CI to CD -->
  <line x1="310" y1="362" x2="310" y2="400" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- CD SECTION -->
  <rect x="50" y="400" width="800" height="160" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="450" y="422" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#27500A">CD — Continuous Deployment</text>

  <!-- Infra CD -->
  <rect x="68" y="438" width="168" height="100" rx="7" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="152" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#173404">Infra CD</text>
  <text x="152" y="481" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">terraform apply</text>
  <text x="152" y="497" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">via OIDC</text>
  <text x="152" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">Azure resources</text>

  <!-- Deploy staging -->
  <rect x="256" y="438" width="168" height="100" rx="7" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#173404">Deploy staging</text>
  <text x="340" y="481" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">App artifact pushed</text>
  <text x="340" y="497" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">to staging slot</text>
  <text x="340" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">Smoke test runs</text>

  <!-- Approval -->
  <rect x="444" y="438" width="138" height="100" rx="7" fill="#FAC775" stroke="#854F0B" stroke-width="0.8"/>
  <text x="513" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#412402">Manual approval</text>
  <text x="513" y="481" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">Engineer reviews</text>
  <text x="513" y="497" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">staging logs</text>
  <text x="513" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">before swap</text>

  <!-- Prod swap -->
  <rect x="602" y="438" width="220" height="100" rx="7" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.8"/>
  <text x="712" y="462" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#173404">Production swap</text>
  <text x="712" y="481" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">Blue-Green slot swap</text>
  <text x="712" y="497" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">Instant, zero downtime</text>
  <text x="712" y="513" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#27500A">100% availability</text>

  <!-- CD stage arrows -->
  <line x1="236" y1="488" x2="254" y2="488" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="424" y1="488" x2="442" y2="488" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="582" y1="488" x2="600" y2="488" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- BOTTOM ROW -->
  <rect x="50" y="582" width="390" height="60" rx="8" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="0.6"/>
  <text x="245" y="604" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Terraform remote state</text>
  <text x="245" y="622" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Azure Blob Storage — state locking enabled</text>

  <rect x="460" y="582" width="390" height="60" rx="8" fill="#E8E6DF" stroke="#B4B2A9" stroke-width="0.6"/>
  <text x="655" y="604" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Observability</text>
  <text x="655" y="622" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Application Insights + Azure Monitor alerts</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
